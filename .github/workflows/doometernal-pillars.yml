name: DOOM Eternal pillars
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  pillars:
    runs-on: ubuntu-24.04
    env:
      AP_TEST_WORLDS: doometernal
      SKIP_REQUIREMENTS_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.10
    - run: python -m pip install pytest==9.0.2 PyYAML==6.0.3 schema==0.7.8 colorama==0.4.6 websockets==13.1 jellyfish==1.2.1 jinja2==3.1.6 typing_extensions==4.15.0 pathspec==1.0.4
    - name: Generate player campaigns and check contracts
      run: |
        mkdir -p .tmp
        export TEMP="$PWD/.tmp" TMP="$PWD/.tmp"
        python -m pytest worlds/doometernal/test -q --basetemp .tmp/pillars -p no:cacheprovider
